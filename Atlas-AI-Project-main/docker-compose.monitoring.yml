version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.route-prefix=/prometheus'
      - '--web.external-url=http://atlas-ai-alb-111188473.ap-south-1.elb.amazonaws.com/prometheus'
    restart: unless-stopped
    networks:
      - devops-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://atlas-ai-alb-111188473.ap-south-1.elb.amazonaws.com/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROUTE_PREFIX=/grafana
    restart: unless-stopped
    networks:
      - devops-net

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host.*|etc)(/.*)?$'
    restart: unless-stopped
    networks:
      - devops-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    restart: unless-stopped
    networks:
      - devops-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  devops-net:
    driver: bridge

